name: CI

on:
  push:
    branches: [ master ]
    paths: [ 'src/**', '.github/workflows/**' ]
  pull_request:
    paths: [ 'src/**', '.github/workflows/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/Localization.sln

      - name: Build
        run: dotnet build src/Localization.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/Localization.Tests/Localization.Tests.csproj -c Release --no-build --logger "trx" --results-directory TestResults

      # MAUI controls without a platform head: they run on Linux
      - name: Test MAUI
        run: dotnet test src/Localization.Maui.Tests/Localization.Maui.Tests.csproj -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # WPF runs only on Windows
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test WPF
        run: dotnet test src/Localization.Wpf.Tests/Localization.Wpf.Tests.csproj -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults

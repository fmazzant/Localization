name: NuGet

# Publishes from a release tag (v4.1.0, v4.1.0-beta.1) or from a manual run on main with the version
# input filled in. Merging to main publishes nothing. A manual run with an empty version is a dry run:
# it tests and packs, but does not push.
# A tag push also creates the GitHub Release of the tag, with the packages attached and the notes of the matching
# "## [x.y.z]" section of CHANGELOG.md (the manual run publishes only the packages).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 4.0.0 or 4.1.0-beta.1). Leave empty for a dry run (test and pack only).'
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test src/Localization.Tests/Localization.Tests.csproj -c Release

  pack:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The version comes from the tag (push) or from the version input (manual run). Its prefix must match
      # <VersionPrefix> in src/Directory.Build.props; the part after "-" becomes the VersionSuffix.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PREFIX=$(dotnet msbuild src/Localization/Localization.csproj -getProperty:VersionPrefix)
          VERSION=""
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif [[ -n "${INPUT_VERSION// /}" ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::A manual publish must run on main (this run is on $GITHUB_REF_NAME). Leave the version empty for a dry run."
              exit 1
            fi
            VERSION="${INPUT_VERSION// /}"
            VERSION="${VERSION#v}"
            PUBLISH=true
          fi

          SUFFIX=""
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$VERSION' is not a valid version (expected 4.1.0 or 4.1.0-beta.1)"
              exit 1
            fi
            [[ "$VERSION" == *-* ]] && SUFFIX="${VERSION#*-}"
            if [[ "${VERSION%%-*}" != "$PREFIX" ]]; then
              echo "::error::Version $VERSION does not match VersionPrefix $PREFIX in src/Directory.Build.props"
              exit 1
            fi
          else
            VERSION="$PREFIX"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (publish: $PUBLISH)"
          echo "### Version $VERSION, publish: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"

      # Every package gets the same version. Package validation (src/Directory.Build.targets) fails the pack
      # when a minor or patch version breaks the API of the first release of the major version.
      - name: Pack
        shell: bash
        run: |
          for project in Localization Localization.Extensions Localization.Json Localization.Wpf Localization.Mvc Localization.Blazor Localization.Maui Localization.Xamarin; do
            dotnet pack "src/$project/$project.csproj" -c Release -o artifacts -p:VersionSuffix="${{ steps.version.outputs.suffix }}"
          done
          # Localization.Xamarin: 4.0.0 only, the last Xamarin release. Remove it from the list after publishing.

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts

  publish:
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # needed to create the GitHub Release
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      # CHANGELOG.md, for the notes of the GitHub Release
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: the NUGET_USER secret (production environment) holds the nuget.org user name, and
      # nuget.org has a trusted publishing policy for this repository, workflow file "nuget.yml" (renaming this file
      # breaks publishing) and environment "production". The login exchanges the
      # GitHub OIDC token for a short-lived API key.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish on NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Tag push only: creates the GitHub Release of the tag with the packages attached and the notes of the matching
      # "## [x.y.z]" section of CHANGELOG.md. Never blocks the publish: a missing or empty section only gives a warning
      # and a release with a link to CHANGELOG.md. A release created by hand on GitHub (which also creates the tag and
      # starts this run) is kept as it is, title and notes included: only the packages are attached, replacing those
      # of a previous run.
      - name: Extract the release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          # Keep a Changelog headings: "## [1.2.3] - 2026-12-01", "## [1.2.3] - Unreleased", "## 1.2.3", ...
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          HEADING="$(grep -E "^## \[?${RELEASE_VERSION//./\\.}\]?( |$)" CHANGELOG.md | head -n 1 | tr -d '\r')"
          NOTES="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES"
          if [ -n "$HEADING" ]; then
            # Prints the lines between the heading and the next "## " heading.
            awk -v heading="$HEADING" '
              { sub(/\r$/, "") }
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES"
          fi
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::warning::CHANGELOG.md has no notes for $RELEASE_VERSION: the release links to CHANGELOG.md"
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > "$NOTES"
          fi

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg artifacts/*.snupkg)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists: attaching the packages"
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

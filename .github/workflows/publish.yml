name: Publish NuGet

# Publishes from a release tag (v4.1.0, v4.1.0-beta.1) or from a manual run on master with the version
# input filled in. Merging to master publishes nothing. A manual run with an empty version is a dry run:
# it tests and packs, but does not push.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 4.0.0 or 4.1.0-beta.1). Leave empty for a dry run (test and pack only).'
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test src/Localization.Tests/Localization.Tests.csproj -c Release

  pack:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The version comes from the tag (push) or from the version input (manual run). Its prefix must match
      # <VersionPrefix> in src/Directory.Build.props; the part after "-" becomes the VersionSuffix.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PREFIX=$(dotnet msbuild src/Localization/Localization.csproj -getProperty:VersionPrefix)
          VERSION=""
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif [[ -n "${INPUT_VERSION// /}" ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::A manual publish must run on master (this run is on $GITHUB_REF_NAME). Leave the version empty for a dry run."
              exit 1
            fi
            VERSION="${INPUT_VERSION// /}"
            VERSION="${VERSION#v}"
            PUBLISH=true
          fi

          SUFFIX=""
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$VERSION' is not a valid version (expected 4.1.0 or 4.1.0-beta.1)"
              exit 1
            fi
            [[ "$VERSION" == *-* ]] && SUFFIX="${VERSION#*-}"
            if [[ "${VERSION%%-*}" != "$PREFIX" ]]; then
              echo "::error::Version $VERSION does not match VersionPrefix $PREFIX in src/Directory.Build.props"
              exit 1
            fi
          else
            VERSION="$PREFIX"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (publish: $PUBLISH)"
          echo "### Version $VERSION, publish: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"

      # Every package gets the same version. Package validation (Directory.Build.props) fails the pack
      # when a minor or patch version breaks the API of the first release of the major version.
      - name: Pack
        shell: bash
        run: |
          for project in Localization Localization.Wpf Localization.Mvc Localization.Blazor Localization.Maui Localization.Xamarin; do
            dotnet pack "src/$project/$project.csproj" -c Release -o artifacts -p:VersionSuffix="${{ steps.version.outputs.suffix }}"
          done
          # Localization.Xamarin: 4.0.0 only, the last Xamarin release. Remove it from the list after publishing.

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts

  publish:
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: set the repository variable NUGET_USER (nuget.org user name) and add a trusted
      # publishing policy for this repository and workflow on nuget.org. Without it the NUGET_API_KEY secret is used.
      - name: NuGet login (trusted publishing)
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish on NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

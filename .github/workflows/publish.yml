name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test src/Localization.Tests/Localization.Tests.csproj -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Localization
          - Localization.Wpf
          - Localization.Mvc
          - Localization.Blazor
          - Localization.Maui
          # 4.0.0 only: last Xamarin release, remove after publishing (Xamarin.Forms is out of support)
          - Localization.Xamarin

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack src/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -o artifacts

      - name: Publish on NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

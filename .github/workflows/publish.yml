name: Publish NuGet

# Publishes only from a release tag (v4.1.0, v4.1.0-beta.1): merging to master publishes nothing.
# A manual run (workflow_dispatch) from a branch is a dry run: it tests and packs, but does not push.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test src/Localization.Tests/Localization.Tests.csproj -c Release

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The version comes from <VersionPrefix> in src/Directory.Build.props: the tag must match it.
      - name: Check the tag version
        id: version
        shell: bash
        run: |
          PREFIX=$(dotnet msbuild src/Localization/Localization.csproj -getProperty:VersionPrefix)
          SUFFIX=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            TAG_PREFIX="${TAG_VERSION%%-*}"
            [[ "$TAG_VERSION" == *-* ]] && SUFFIX="${TAG_VERSION#*-}"
            if [[ "$TAG_PREFIX" != "$PREFIX" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $PREFIX in src/Directory.Build.props"
              exit 1
            fi
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Version: $PREFIX${SUFFIX:+-$SUFFIX}"

      # Every package gets the same version. Package validation (Directory.Build.props) fails the pack
      # when a minor or patch version breaks the API of the first release of the major version.
      - name: Pack
        shell: bash
        run: |
          for project in Localization Localization.Wpf Localization.Mvc Localization.Blazor Localization.Maui Localization.Xamarin; do
            dotnet pack "src/$project/$project.csproj" -c Release -o artifacts -p:VersionSuffix="${{ steps.version.outputs.suffix }}"
          done
          # Localization.Xamarin: 4.0.0 only, the last Xamarin release. Remove it from the list after publishing.

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: set the repository variable NUGET_USER (nuget.org user name) and add a trusted
      # publishing policy for this repository and workflow on nuget.org. Without it the NUGET_API_KEY secret is used.
      - name: NuGet login (trusted publishing)
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish on NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
